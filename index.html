<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F4C3A">
<title>머니스텝 스토리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#0F4C3A;--green:#0E9F7A;--green-d:#0A7B5E;--orange:#F2994A;--orange-d:#D57A2C;--mint:#EAF5F0;
  --bg:#F7FAF8;--card:#fff;--text:#1d2b24;--sub:#5f6f68;--line:#dde8e3;
  --red:#D6544A;--red-d:#B03E35;--redbg:#FDEDEA;--okbg:#E3F6EC;--warnbg:#FFF4E7;
  --brown:#B5713A;--r:18px;
  --display:"Jua","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
#app{max-width:600px;margin:0 auto;padding:12px 16px 110px}
body.focus #app{padding-bottom:120px}
body.fbopen #app{padding-bottom:360px}
h1,h2,h3{margin:0;line-height:1.35}
p{margin:.45em 0}

/* 공통 버튼 (눌리는 느낌의 입체 버튼) */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-radius:16px;padding:14px 18px;font-size:17px;font-weight:800;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);transition:transform .06s,box-shadow .06s;letter-spacing:-.01em}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn.orange{background:var(--orange);box-shadow:0 4px 0 var(--orange-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.white{background:#fff;color:var(--deep);box-shadow:0 4px 0 #cfe0d8}
.btn.ghost{background:#fff;color:var(--green);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:12px}
.btn:disabled{background:#c8d6d0;box-shadow:0 4px 0 #b3c4bc;cursor:default}
.btn-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 150px}

/* 상단 바 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 14px}
.brand{display:flex;align-items:center;gap:8px}
.brand b{font-family:var(--display);font-size:22px;color:var(--deep);font-weight:400}
.brand small{font-size:11px;font-weight:700;color:var(--orange);background:var(--warnbg);padding:2px 8px;border-radius:20px}
.pills{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:4px 10px;font-weight:800;font-size:14px;color:var(--deep)}
.pill.acorn{color:var(--brown)}
.page-title{font-family:var(--display);font-weight:400;font-size:26px;color:var(--deep);margin:4px 0}
.page-sub{color:var(--sub);font-size:14px;margin:0 0 14px}
.back{background:none;border:0;color:var(--green);font-weight:800;padding:6px 0;margin-bottom:4px}

/* 다람 말풍선 카드 */
.hello{display:flex;align-items:flex-end;gap:10px;margin:6px 0 18px}
.hello .daram{flex:0 0 auto}
.speech{position:relative;flex:1;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-size:15px}
.speech::before{content:'';position:absolute;left:-10px;bottom:18px;border:8px solid transparent;border-right-color:var(--line)}
.speech::after{content:'';position:absolute;left:-7px;bottom:18px;border:8px solid transparent;border-right-color:#fff}
.speech.plain::before,.speech.plain::after{display:none}
.speech b.t{display:block;font-family:var(--display);font-weight:400;font-size:19px;color:var(--deep);margin-bottom:2px}
.speech .btn{margin-top:10px}

/* 장(챕터)과 길 */
.chapter{margin:10px 0 26px}
.ch-banner{background:var(--c);color:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.ch-banner small{font-weight:700;opacity:.85;font-size:12px}
.ch-banner h2{font-family:var(--display);font-weight:400;font-size:23px;margin:2px 0}
.ch-banner p{margin:0;font-size:14px;opacity:.95}
.ch-banner .prog{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;font-weight:700}
.ch-banner .prog i{flex:1;height:8px;border-radius:6px;background:rgba(255,255,255,.3);overflow:hidden;display:block}
.ch-banner .prog i b{display:block;height:100%;background:#fff;border-radius:6px}
.path{display:flex;flex-direction:column;align-items:center;padding:16px 0 4px}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;transform:translateX(var(--x));margin-bottom:14px;width:150px}
.node{width:72px;height:68px;border-radius:50%;border:0;background:#fff;box-shadow:0 6px 0 var(--line),inset 0 0 0 3px var(--line);font-size:30px;display:grid;place-items:center;transition:transform .06s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line),inset 0 0 0 3px var(--line)}
.node.done{background:var(--c);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.node.doing{background:#fff;box-shadow:0 6px 0 var(--orange-d),inset 0 0 0 4px var(--orange)}
.node.next{animation:pulse 1.8s infinite}
.node.mission{border-radius:22px}
.node .ck{position:absolute;right:30px;top:-4px;background:#fff;color:var(--green);border-radius:50%;width:24px;height:24px;font-size:14px;display:grid;place-items:center;font-weight:900;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.stop-label{font-size:13px;font-weight:700;text-align:center;margin-top:10px;line-height:1.35;color:var(--text)}
.stop-label small{display:block;font-weight:500;color:var(--sub);font-size:11px}
.stop .buddy{position:absolute;top:-6px;width:74px;display:flex;flex-direction:column;align-items:center}
.stop .buddy.l{right:calc(100% - 22px)}
.stop .buddy.r{left:calc(100% - 22px)}
.stop .buddy span{font-size:11px;font-weight:800;background:var(--orange);color:#fff;padding:2px 8px;border-radius:10px;white-space:nowrap;margin-bottom:-2px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* 레슨 화면 */
.lesson-top{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;font-size:22px;color:#90a19a;flex:0 0 38px}
.bar{flex:1;height:14px;background:var(--line);border-radius:10px;overflow:hidden}
.bar div{height:100%;background:var(--green);border-radius:10px;transition:width .35s;position:relative}
.bar div::after{content:'';position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.lesson-name{font-size:12px;color:var(--sub);margin:-6px 0 12px 48px;font-weight:600}
.retry{display:inline-block;font-size:12px;font-weight:800;color:var(--orange-d);background:var(--warnbg);padding:4px 10px;border-radius:20px;margin-bottom:10px}

/* 대화 */
.chat{display:flex;flex-direction:column;gap:12px;min-height:200px}
.line{display:flex;align-items:flex-end;gap:8px;animation:pop .25s ease-out}
.line.r{flex-direction:row-reverse}
.line .av{flex:0 0 44px}
.say{max-width:78%}
.line.r .say{text-align:right}
.who{font-size:12px;font-weight:800;color:var(--sub);margin:0 6px 2px}
.bubble{display:inline-block;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px 18px 18px 6px;padding:10px 14px;font-size:16px}
.line.r .bubble{background:var(--green);border-color:var(--green);color:#fff;border-radius:18px 18px 6px 18px}
.line.r .bubble .term{color:#fff;border-bottom-color:#bff0dc}
.line.d .bubble{background:#FFF8EE;border-color:#F4DDBF}
.narr{align-self:center;max-width:92%;text-align:center;font-size:14px;color:var(--sub);background:var(--mint);padding:8px 14px;border-radius:14px;animation:pop .25s ease-out}
.tap-hint{text-align:center;font-size:12px;color:#9aaba4;margin-top:6px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

/* 문제 */
.ask{display:flex;align-items:flex-end;gap:8px;margin-bottom:16px}
.ask .daram{flex:0 0 auto}
.ask .speech{font-size:17px;font-weight:700;line-height:1.55}
.ask .speech .kind{display:block;font-size:12px;font-weight:800;color:var(--orange-d);margin-bottom:2px}
.hint{margin-top:8px;font-size:14px;font-weight:500;background:var(--warnbg);border-radius:10px;padding:8px 10px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:16px;box-shadow:0 4px 0 var(--line);transition:transform .06s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--green);background:var(--okbg);box-shadow:0 4px 0 var(--green);font-weight:800}
.opt.wrong{border-color:var(--red);background:var(--redbg);box-shadow:0 4px 0 var(--red)}
.opt:disabled:not(.correct):not(.wrong){opacity:.55}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox .opt{text-align:center;padding:18px 8px}
.ox .opt .mark{display:block;font-family:var(--display);font-size:56px;line-height:1.05;color:inherit}
.ox .o .mark{color:var(--green)!important}
.ox .x .mark{color:var(--red)!important}
.ox .opt span{font-size:14px;font-weight:700;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chips .opt{padding:10px 18px}
.sentence{font-size:19px;font-weight:700;text-align:center;background:#fff;border:2px dashed var(--line);border-radius:16px;padding:18px 12px;margin-bottom:16px;line-height:1.8}
.slot{display:inline-block;min-width:84px;border-bottom:3px solid var(--green);color:var(--green);padding:0 6px}
.slot.ok{background:var(--okbg);color:var(--deep);border-radius:8px 8px 0 0}
.slot.bad{background:var(--redbg);color:var(--red);border-color:var(--red);border-radius:8px 8px 0 0}
.say-opts .opt{border-color:#bfe5d3;background:#F3FBF7}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.match .opt{text-align:center;padding:12px 8px;font-size:15px;min-height:58px}
.match .col.l .opt{font-weight:800;color:var(--deep)}
.match .opt.sel{border-color:var(--orange);background:var(--warnbg);box-shadow:0 4px 0 var(--orange)}
.match .opt.done{border-color:var(--green);background:var(--okbg);box-shadow:0 2px 0 var(--green);opacity:.75}
.match .opt.miss{animation:shake .35s}
.order-sel{display:flex;flex-direction:column;gap:8px;min-height:120px;background:#fff;border:2px dashed var(--line);border-radius:16px;padding:12px;margin-bottom:14px;counter-reset:ord}
.order-sel:empty::before{content:'아래에서 순서대로 눌러 주세요';color:#9aaba4;font-size:14px;text-align:center;margin:auto}
.order-sel .opt{counter-increment:ord;padding:10px 14px}
.order-sel .opt::before{content:counter(ord);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--mint);color:var(--deep);font-size:12px;font-weight:800;margin-right:8px}
.order-pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;justify-content:center}
.order-pool .opt{padding:10px 14px}
.combo{display:inline-block;margin-left:8px;font-size:13px;font-weight:800;color:#fff;background:var(--orange);padding:2px 9px;border-radius:20px;vertical-align:4px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.task{background:var(--warnbg);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;margin:-4px 0 12px}

/* 피드백 패널 */
.fbp{position:fixed;left:0;right:0;bottom:0;z-index:30;animation:slide .22s ease-out}
.fbp.hidden{display:none}
.fbp-in{max-width:600px;margin:0 auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;max-height:62vh;overflow:auto;box-shadow:0 -6px 24px rgba(0,0,0,.08)}
.fbp-in.good{background:var(--okbg)}
.fbp-in.bad{background:var(--redbg)}
.fbp-head{display:flex;align-items:center;gap:10px}
.fbp-head b{font-family:var(--display);font-weight:400;font-size:22px}
.good .fbp-head b{color:var(--green-d)}
.bad .fbp-head b{color:var(--red-d)}
.plus{display:inline-flex;align-items:center;gap:3px;margin-left:8px;font-size:14px;font-weight:800;color:var(--brown);background:#fff;padding:2px 8px;border-radius:20px;vertical-align:4px}
.fbp-exp{font-size:15px;margin:6px 0 4px}
.fbp-note{font-size:13px;color:var(--sub);margin:4px 0 0}
.fbp .btn{margin-top:12px}
@keyframes slide{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(transparent,var(--bg) 30%);padding:26px 16px calc(16px + env(safe-area-inset-bottom))}
.actionbar>div{max-width:568px;margin:0 auto}

/* 용어 */
.term{display:inline;background:none;border:0;padding:0;color:inherit;font-weight:800;border-bottom:2.5px dotted var(--green);line-height:inherit}
.term:hover{background:rgba(14,159,122,.08)}

/* 안내문 */
.doc{background:#FFFDF8;border:1.5px solid #E9DFCC;border-radius:14px;padding:14px;margin-bottom:16px;font-size:14px}
.doc-bank{font-size:12px;font-weight:800;color:#8a7a5a}
.doc-title{font-size:16px;font-weight:800;margin:2px 0 8px}
.doc table{width:100%;border-collapse:collapse}
.doc th,.doc td{border-top:1px solid #efe6d4;padding:7px 6px;text-align:left;vertical-align:top}
.doc th{color:#6d6150;font-weight:600}
.doc thead th{background:#f7f0e2;border-top:0}
.doc td.num{text-align:right;font-variant-numeric:tabular-nums}
.doc tr.sum td,.doc tr.sum th{font-weight:800;color:var(--deep);border-top:2px solid #e2d6bd}
.doc-note{font-size:12px;color:#8a7a5a;margin-top:8px}

/* 시뮬레이션 */
.sim{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.sim-title{font-weight:800;color:var(--deep);margin-bottom:8px}
.ctrl{margin-bottom:8px}
.ctrl-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.ctrl-top label{font-weight:700;color:var(--sub)}
.ctrl-val{display:flex;align-items:center;gap:4px;font-weight:800}
.ctrl-val input{width:84px;text-align:right;font-weight:800;border:1.5px solid var(--line);border-radius:8px;padding:3px 8px;background:var(--bg)}
.ctrl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent}
.ctrl input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:6px;background:var(--line)}
.ctrl input[type=range]::-moz-range-track{height:8px;border-radius:6px;background:var(--line)}
.ctrl input[type=range]::-moz-range-progress{height:8px;border-radius:6px;background:var(--green)}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--orange);border:4px solid #fff;box-shadow:0 2px 0 var(--orange-d),0 1px 6px rgba(0,0,0,.2);margin-top:-9px}
.ctrl input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--orange);border:4px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin:4px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sim canvas{width:100%;display:block}
.sim-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.sim-stats div{background:var(--mint);border-radius:12px;padding:8px 10px}
.sim-stats span{display:block;font-size:12px;color:var(--sub)}
.sim-stats b{font-size:16px;color:var(--deep)}
.sim-note{font-size:12px;color:#a35d1c;margin:10px 0 0}

/* 목록 */
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 3px 0 var(--line)}
.list-item b{display:block}
.list-item span{font-size:13px;color:var(--sub)}
.section-label{font-size:13px;font-weight:800;color:var(--sub);margin:18px 0 8px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;background:var(--mint);color:var(--deep);white-space:nowrap}
.badge.o{background:var(--warnbg);color:var(--orange-d)}
.gloss{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.gloss-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gloss-top b{font-size:17px;color:var(--deep)}
.gloss p{margin:6px 0 0;font-size:15px}
.gloss .ex{font-size:14px;color:var(--sub)}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.chip-list .term{border:2px solid var(--line);border-radius:20px;padding:4px 12px;background:#fff}
.card{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.small{font-size:13px;color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--deep);line-height:1.2}
.stat span{font-size:12px;color:var(--sub)}
.ubar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.ubar div{height:100%;background:var(--green)}
details{margin-top:12px}
summary{cursor:pointer;color:var(--sub);font-size:14px}
.notice-bar{background:var(--warnbg);color:#8a4a12;font-size:13px;padding:10px 12px;border-radius:12px;margin-bottom:12px}

/* 결과 */
.result{text-align:center;padding:10px 0 4px}
.result h2{font-family:var(--display);font-weight:400;font-size:30px;color:var(--deep);margin-top:6px}
.reward{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
.reward div{border:2px solid var(--line);border-radius:16px;padding:10px;background:#fff}
.reward b{display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--display);font-weight:400;font-size:26px;color:var(--brown)}
.reward div:last-child b{color:var(--green)}
.reward span{font-size:12px;color:var(--sub);font-weight:700}

/* 시트 */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(10,30,22,.45)}
.sheet-panel{position:relative;width:100%;max-width:600px;background:#fff;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:slide .2s ease-out;max-height:85vh;overflow:auto}
.sheet-panel h3{font-family:var(--display);font-weight:400;font-size:24px;color:var(--deep)}
.sheet-ex{background:var(--mint);border-radius:12px;padding:10px 12px;font-size:15px;margin-top:10px}
.sheet-ex b{color:var(--green);margin-right:6px}
.sheet-meta{font-size:12px;color:var(--sub);margin:10px 0 14px}

/* 하단 내비 */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 8px;background:none;border:0;color:#9aaba4;font-size:12px;font-weight:800}
.nav button .ni{font-size:23px;line-height:1.2;filter:grayscale(1) opacity(.55)}
.nav button.on{color:var(--deep)}
.nav button.on .ni{filter:none}
body.focus .nav{display:none}

<script>
'use strict';
/* =========================================================
   머니스텝 스토리판 (브랜치)
   - 캐릭터(다람)와 함께 사회초년생 하루의 1년을 따라가는 이야기형 학습
   - 단일 HTML · 외부 JS 라이브러리 없음 · 저장: localStorage
   - 화면 전환은 주소(#)를 쓰지 않는 내부 라우터 (미리보기 창에서도 동작)
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const app = () => document.getElementById('app');

/* ---------------- 1. 유틸 ---------------- */
function today(d = new Date()) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function daysBetween(a, b) { const pa = a.split('-').map(Number), pb = b.split('-').map(Number); return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 864e5); }
const nf = (n, d = 0) => Number(n).toLocaleString('ko-KR', { maximumFractionDigits: d });
const won = n => nf(Math.round(n)) + '원';
function man(n, d = 1) {
  const m = n / 1e4;
  if (Math.abs(m) >= 1e4) { const eok = Math.floor(m / 1e4), rest = Math.round(m - eok * 1e4); return nf(eok) + '억' + (rest > 0 ? ' ' + nf(rest) + '만' : '') + ' 원'; }
  return nf(m, d) + '만 원';
}
function axisMan(v) { if (v >= 1e8) return nf(v / 1e8, 1) + '억'; if (v === 0) return '0'; return nf(v / 1e4, v < 1e5 ? 1 : 0) + '만'; }
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];

}

/* ---------------- 3. 저장 ---------------- */
const KEY = 'moneystep.story.v1';
function blankState() {
  return { version: 1, createdAt: today(), intro: false, placement: null, lessons: {}, days: [], lastVisit: null, glossary: {}, wrongBank: [], current: null, acorns: 0, sound: true };
}
let storageOk = true;
function loadState() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); if (d && d.version === 1) return Object.assign(blankState(), d); } } catch (e) { storageOk = false; }
  return blankState();
}
let S = loadState();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { storageOk = false; } }
function markStudy() { const t = today(); if (!S.days.includes(t)) S.days.push(t); }
function isDone(lid) { const s = S.lessons[lid]; return !!(s && (s.everDone || s.status === 'done')); }

function feedbackFx(ok) {

    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = actx.currentTime, notes = ok ? [660, 880] : [240, 190];
      notes.forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain(), t = t0 + i * 0.09;
        o.type = ok ? 'sine' : 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);

}

/* 짝 맞추기: 하나라도 틀리게 연결하면 오답 처리(그래도 끝까지 맞춘 뒤 해설) */
function renderMatch(sess, idx, step) {

/* 순서대로 놓기 */
function renderOrder(sess, idx, step) {
  const stage = $('#stage'), n = step.items.length;
  let pool = shuffle(step.items.map((_, i) => i)); if (pool.every((v, i) => v === i)) pool = pool.reverse();
  const chosen = [];
  stage.innerHTML = askHTML(step, sess.st) + `<div class="order-sel" id="oSel"></div><div class="order-pool" id="oPool"></div><button class="btn" id="oCheck" disabled>확인</button>`;
  const draw = () => {
    $('#oSel').innerHTML = chosen.map(i => `<button type="button" class="opt" data-i="${i}">${step.items[i]}</button>`).join('');
    $('#oPool').innerHTML = pool.filter(i => !chosen.includes(i)).map(i => `<button type="button" class="opt" data-i="${i}">${step.items[i]}</button>`).join('');
    $('#oCheck').disabled = chosen.length !== n;
    $$('#oPool .opt').forEach(b => b.onclick = () => { chosen.push(+b.dataset.i); draw(); });
    $$('#oSel .opt').forEach(b => b.onclick = () => { chosen.splice(chosen.indexOf(+b.dataset.i), 1); draw(); });

    $('#oCheck').remove();

function answer(sess, idx, step, ok, extra) {
  const st = sess.st; markStudy();
  const retry = st.queue.slice(0, st.pos).includes(idx);
  let requeued = false, earned = 0;
  feedbackFx(ok);
  st.combo = ok ? (st.combo || 0) + 1 : 0;
  if (ok) {
    st.correct++; st.streak = 0;
    if (!retry && !sess.noReward) { earned = 1; S.acorns++; st.earned = (st.earned || 0) + 1; }
    sess.onCorrect && sess.onCorrect(step, idx);
  } else {
    st.wrong++; st.streak++;
    if (!sess.noRequeue && !st.requeued.includes(idx)) { st.requeued.push(idx); st.queue.push(idx); requeued = true; }
    sess.onWrong && sess.onWrong(step, idx);
  }
  st.pos++; sess.persist();
  const f = $('#fbp');
  f.innerHTML = `<div class="fbp-in ${ok ? 'good' : 'bad'}" role="status">
    <div class="fbp-head">${daram(ok ? 'happy' : 'oops', 58)}<div><b>${pick(ok ? OK_LINES : NG_LINES)}</b>${earned ? `<span class="plus">+1 ${ACORN}</span>` : ''}${st.combo >= 3 ? `<span class="combo">🔥 ${st.combo}연속 정답!</span>` : ''}</div></div>
    ${extra ? `<div class="fbp-exp"><b>${extra}</b></div>` : ''}<div class="fbp-exp">${T(step.exp || '')}</div>
    ${requeued ? '<p class="fbp-note">🔁 이 문제는 레슨 끝에서 한 번 더 나와요.</p>' : ''}
    ${!ok && st.streak === 2 ? '<p class="fbp-note">💡 다음 문제부터 다람이가 힌트를 줄게요.</p>' : ''}
    <button class="btn ${ok ? '' : 'red'}" id="cont">계속</button></div>`;
  f.classList.remove('hidden'); document.body.classList.add('fbopen');
  $('#cont').onclick = () => renderStep(sess);

}

  if (!st || st.status !== 'doing') { st = { status: 'doing', queue: les.steps.map((_, i) => i), pos: 0, requeued: [], streak: 0, correct: 0, wrong: 0, earned: 0, everDone: !!(st && st.everDone), doneCount: (st && st.doneCount) || 0 }; S.lessons[lid] = st; }
  S.current = lid; save();
  renderStep({
    title: `${les.ch}장 · ${les.title}`, steps: les.steps, st,
    persist() { S.lessons[lid] = st; save(); },
    onWrong(step, idx) { if (!S.wrongBank.some(w => w.lid === lid && w.idx === idx)) S.wrongBank.push({ lid, idx, at: today() }); },
    onQuit() { navigate('#home'); },
    onDone() {
      const first = !st.everDone, bonus = first ? (les.mission ? 5 : 3) : 0;
      S.acorns += bonus; st.bonus = bonus;
      st.status = 'done'; st.everDone = true; st.doneAt = today(); st.doneCount = (st.doneCount || 0) + 1;
      if (S.current === lid) S.current = null; save();
      navigate('#done/' + lid);
    }
  });
}
function viewDone(lid) {
  const les = L[lid], st = S.lessons[lid]; if (!les || !st) { navigate('#home'); return; }
  setFocus(true); hideFb();
  const graded = les.steps.filter(s => GRADED.includes(s.t)).length, firstOk = graded - st.requeued.length;
  const ch = CH.find(c => c.id === les.ch), chDone = ch.lessons.every(isDone), allDone = ALL.every(isDone);
  const nxt = ALL[ALL.indexOf(lid) + 1], terms = termsIn(les.steps);
  const title = allDone ? '1년 이야기 완주!' : chDone && les === L[ch.lessons[ch.lessons.length - 1]] ? `${ch.id}장 클리어!` : les.mission ? '도전 성공!' : '레슨 완료!';
  app().innerHTML = `<div class="result">${daram('cheer', 140)}<h2>${title}</h2><p>${les.title}</p>
    <div class="reward"><div><b>${ACORN}+${(st.earned || 0) + (st.bonus || 0)}</b><span>받은 도토리</span></div><div><b>${firstOk}/${graded}</b><span>한 번에 맞힘</span></div></div>
    ${st.requeued.length ? '<p class="small">틀렸던 문제는 복습함에 넣어 두었어요.</p>' : ''}
    ${allDone ? `<div class="card" style="text-align:left"><b>🏁 이제 혼자서도 할 수 있어요</b><p class="small" style="margin:4px 0 0">월급 명세서, 은행 상품 안내문, 대출 비교표를 읽고 판단할 준비가 됐어요. 막히는 단어는 용어장에서 다시 찾아보세요.</p></div>` : ''}
    ${terms.length ? `<div class="small" style="margin-top:6px">이번에 만난 용어</div><div class="chip-list">${terms.map(t => `<button class="term" data-term="${t}">${t}</button>`).join('')}</div>` : ''}</div>`;
  setAction(`${nxt && !allDone ? `<button class="btn" data-lesson-go="${nxt}">다음 이야기: ${L[nxt].title}</button><div style="height:10px"></div>` : ''}<button class="btn ghost" data-go="#home">지도로 돌아가기</button>`);
}
function viewPlacement() {
  setFocus(true); let i = 0; const res = [];
  const draw = () => {
    if (i >= PLACEMENT.length) return finish();
    const q = PLACEMENT[i];
    app().innerHTML = `<div class="lesson-top"><button class="icon-btn" id="quit" aria-label="나가기">✕</button><div class="bar"><div style="width:${Math.max(i / PLACEMENT.length * 100, 3)}%"></div></div><span class="small">${i + 1}/${PLACEMENT.length}</span></div>
      <div class="ask">${daram('think', 70)}<div class="speech"><span class="kind">아는 만큼 확인하기 · 모르면 "잘 모르겠어요"도 괜찮아</span>${q.q}</div></div>
      <div class="opts">${PL_OPTS.map((o, k) => `<button type="button" class="opt" data-i="${k}">${o}</button>`).join('')}</div>`;
    $('#quit').onclick = () => navigate('#home');
    $$('.opt').forEach(b => b.onclick = () => { res.push(+b.dataset.i === q.a); i++; draw(); });
  };
  const finish = () => {
    const miss = PLACEMENT.findIndex((q, k) => !res[k]), start = miss === -1 ? '5-2' : PLACEMENT[miss].lid, score = res.filter(Boolean).length;
    S.placement = { start, score, at: today() }; save();
    app().innerHTML = `<div class="result">${daram(score >= 4 ? 'cheer' : 'happy', 130)}<h2>${score}/${PLACEMENT.length} 정답!</h2>
      <p>${score >= 4 ? '와, 꽤 많이 알고 있구나!' : '좋아, 같이 차근차근 가 보자!'}<br>추천 시작 지점은 <b>${start} ${L[start].title}</b>이야.</p>
      <p class="small">추천일 뿐이에요. 지도에서 어떤 레슨이든 골라 볼 수 있어요.</p></div>`;
    setAction(`<button class="btn" data-lesson-go="${start}">추천 레슨 시작</button><div style="height:10px"></div><button class="btn ghost" data-go="#home">지도 보기</button>`);
  };
  draw();
}
/* 복습 */
function termQuestion(k) {
  const others = shuffle(Object.keys(TERMS).filter(x => x !== k && !x.includes(k) && !k.includes(x))).slice(0, 2), opts = shuffle([k, ...others]);
  return { t: 'choice', q: `이 설명에 맞는 용어는?<div class="hint" style="background:var(--mint)">${TERMS[k].d}</div>`, opts, a: opts.indexOf(k), exp: `<b>${k}</b> — 예) ${TERMS[k].ex}`, _term: k };
}
const REVIEWABLE = ['choice', 'ox', 'blank', 'notice', 'say', 'match', 'order'];
function buildReview(n = 3) {
  const out = [], used = new Set();
  const add = w => { const key = w.lid + ':' + w.idx, st = L[w.lid] && L[w.lid].steps[w.idx]; if (!st || used.has(key) || !REVIEWABLE.includes(st.t)) return false; used.add(key); out.push(Object.assign({}, st, { _src: { lid: w.lid, idx: w.idx } })); return true; };
  for (const w of [...S.wrongBank].reverse()) { if (out.length >= 2) break; add(w); }
  const terms = Object.entries(S.glossary).filter(([k]) => TERMS[k]).sort((a, b) => b[1] - a[1]).map(e => e[0]);
  for (const k of terms) { if (out.length >= n) break; out.push(termQuestion(k)); }
  for (const w of [...S.wrongBank].reverse()) { if (out.length >= n) break; add(w); }
  for (const lid of shuffle(ALL.filter(l => isDone(l) || (S.lessons[l] && S.lessons[l].pos > 0)))) {
    for (const idx of shuffle(L[lid].steps.map((_, i) => i))) { if (out.length >= n) break; add({ lid, idx }); }
    if (out.length >= n) break;
  }
  return out;
}
function viewReview(mode) {
  const steps = buildReview(3);
  if (!steps.length) { setFocus(false); app().innerHTML = `${topbar()}<div class="hello">${daram('think', 84)}<div class="speech"><b class="t">아직 복습할 게 없어!</b>레슨을 하나 끝내거나 용어를 눌러 보면 복습 문제가 생겨.<button class="btn" data-go="#home">지도로</button></div></div>`; return; }
  const st = { queue: steps.map((_, i) => i), pos: 0, requeued: [], streak: 0, correct: 0, wrong: 0, earned: 0 }, back = mode === 'back';
  const sess = {
    title: back ? '오랜만이야! 지난 내용 3문제로 몸풀기' : '복습 3문제', steps, st, noRequeue: true,
    banner: back ? `<div class="hello" style="margin:0 0 14px">${daram('happy', 64)}<div class="speech"><b class="t">오랜만이야!</b>지난번 내용 3문제만 풀고 시작하자. <button class="btn sm ghost" id="skipRv" style="margin-top:8px">건너뛰기</button></div></div>` : '',
    persist() { save(); },
    onCorrect(step) { if (step._src) S.wrongBank = S.wrongBank.filter(w => !(w.lid === step._src.lid && w.idx === step._src.idx)); },
    onQuit() { navigate('#home'); },
    onDone() {
      hideFb();
      app().innerHTML = `<div class="result">${daram('cheer', 130)}<h2>복습 완료!</h2><p>${st.correct}/${steps.length} 정답 · 도토리 +${st.earned}</p>
        <p class="small">${st.wrong ? '틀린 문제는 복습함에 남겨 두었어요.' : '맞힌 오답은 복습함에서 뺐어요.'}</p></div>`;
      setAction(`${nextLesson() ? `<button class="btn" data-lesson-go="${nextLesson()}">이야기 이어 가기</button><div style="height:10px"></div>` : ''}<button class="btn ghost" data-go="#home">지도로</button>`);
    }
  };
  renderStep(sess); sess.banner = '';
  const sk = $('#skipRv'); if (sk) sk.onclick = () => { clearAction(); navigate('#home'); };
}
/* 시뮬레이션 */
function viewSimList() {
  setFocus(false);
  app().innerHTML = `${topbar()}<h1 class="page-title">시뮬레이션</h1><p class="page-sub">슬라이더를 움직이면 그래프와 숫자가 바로 바뀌어요. 내 숫자를 직접 넣어 볼 수도 있어요.</p>
    ${CH.map(ch => { const ks = Object.keys(SIMS).filter(k => SIMS[k].ch === ch.id); return ks.length ? `<div class="section-label">${ch.id}장 · ${ch.title}</div>` + ks.map(k => `<button class="list-item" data-go="#sim/${k}"><span><b>${SIMS[k].title}</b><span>${SIMS[k].desc}</span></span><span>›</span></button>`).join('') : ''; }).join('')}
    <p class="small" style="margin-top:14px">모든 결과는 이해를 돕기 위한 계산이며, 특정 금융 상품을 추천하지 않아요.</p>`;
}
function viewSim(key) {
  const s = SIMS[key]; if (!s) { navigate('#sim'); return; }
  setFocus(false);
  app().innerHTML = `<button class="back" data-go="#sim">‹ 시뮬레이션 목록</button><h1 class="page-title">${s.title}</h1><p class="page-sub">${s.desc}</p><div id="simfull"></div>`;
  mountSim($('#simfull'), key, {});
}
/* 용어장 */
function viewGlossary() {
  setFocus(false);
  const list = Object.entries(S.glossary).filter(([k]) => TERMS[k]).sort((a, b) => b[1] - a[1]);
  let html = `${topbar()}<h1 class="page-title">내 용어장</h1><p class="page-sub">이야기 속에서 눌러 본 용어가 모여요. 자주 본 용어일수록 복습에 먼저 나와요.</p>`;
  if (!list.length) html += `<div class="hello">${daram('think', 80)}<div class="speech"><b class="t">아직 비어 있어!</b>대화 속 <span class="term" style="cursor:default">밑줄 친 단어</span>를 눌러 보면 여기에 쌓여.</div></div>`;
  else html += `<button class="btn" data-go="#review" style="margin-bottom:14px">자주 본 용어로 복습하기</button>` + list.map(([k, c]) => `<div class="gloss"><div class="gloss-top"><b>${k}</b><span class="badge ${c >= 3 ? 'o' : ''}">${c}번 봤어요</span></div><p>${TERMS[k].d}</p><p class="ex">예) ${TERMS[k].ex}</p></div>`).join('');
  const rest = Object.keys(TERMS).filter(k => !S.glossary[k]);
  if (rest.length) html += `<details><summary>아직 안 본 용어 ${rest.length}개</summary><div class="chip-list" style="justify-content:flex-start">${rest.map(t => `<button class="term" data-term="${t}">${t}</button>`).join('')}</div></details>`;
  html += `<p class="small" style="margin-top:14px">용어 풀이는 한국은행 「경제금융용어 700선」의 뜻을 바탕으로 쉬운 말로 다시 썼어요.</p>`;
  app().innerHTML = html;
}
/* 기록 */
function viewRecords() {
  setFocus(false);
  const doneN = ALL.filter(isDone).length, tot = Object.values(S.lessons).reduce((a, s) => { a.c += s.correct || 0; a.w += s.wrong || 0; return a; }, { c: 0, w: 0 });
  app().innerHTML = `${topbar()}<h1 class="page-title">기록</h1><p class="page-sub">가입 없이 이 브라우저에 저장돼요.</p>
    <div class="stats"><div class="stat"><b>${S.days.length}</b><span>누적 학습일</span></div><div class="stat"><b>${doneN}</b><span>완료 레슨</span></div><div class="stat"><b>${S.acorns}</b><span>모은 도토리</span></div></div>
    <div class="card"><b>장별 진행</b>${CH.map(c => { const d = c.lessons.filter(isDone).length; return `<div style="margin-top:10px;font-size:14px;display:flex;justify-content:space-between"><span>${c.id}장 ${c.title}</span><span class="small">${d}/${c.lessons.length}</span></div><div class="ubar"><div style="width:${d / c.lessons.length * 100}%;background:${c.color}"></div></div>`; }).join('')}
      <p class="small" style="margin-top:12px">푼 문제 ${tot.c + tot.w}개 · 정답 ${tot.c}개 · 복습함 ${S.wrongBank.length}개</p></div>
    <div class="card"><b>효과음·진동</b><p class="small">정답·오답일 때 짧은 소리를 내고, 오답이면 휴대폰이 살짝 진동해요.</p><button class="btn sm ${S.sound === false ? '' : 'ghost'}" id="sound">${S.sound === false ? '효과음 켜기' : '효과음 끄기'}</button></div>
    <div class="card"><b>기록 옮기기</b><p class="small">브라우저 데이터를 지우거나 기기를 바꾸면 기록이 사라져요. 파일로 내보내 두었다가 불러올 수 있어요.</p>
      <div class="btn-row"><button class="btn sm" id="exp">기록 내보내기</button><button class="btn sm ghost" id="impBtn">기록 불러오기</button></div><input type="file" id="imp" accept="application/json,.json" hidden></div>
    <div class="card"><b>처음부터 다시</b><p class="small">진행 상황, 도토리, 용어장, 복습함을 모두 지워요.</p><button class="btn sm ghost" id="reset" style="color:var(--red)">기록 초기화</button>
      <details><summary>테스트용 도구</summary><p class="small">며칠 만에 접속한 상황(복습 3문제부터 시작)을 확인할 때 써요.</p><button class="btn sm ghost" id="fakeAway">마지막 접속일을 5일 전으로 바꾸기</button></details></div>`;
  $('#sound').onclick = () => { S.sound = S.sound === false; save(); toast(S.sound ? '효과음을 켰어요' : '효과음을 껐어요'); viewRecords(); };
  $('#exp').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' })); a.download = `moneystep-story-기록-${today()}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); };
  $('#impBtn').onclick = () => $('#imp').click();
  $('#imp').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d || d.version !== 1 || typeof d.lessons !== 'object' || !('acorns' in d)) throw 0; S = Object.assign(blankState(), d); save(); toast('기록을 불러왔어요'); viewRecords(); } catch (err) { toast('머니스텝 스토리 기록 파일이 아니에요'); } };
    rd.readAsText(f); };
  $('#reset').onclick = () => { if (confirm('정말 모든 기록을 지울까요? 되돌릴 수 없어요.')) { S = blankState(); save(); toast('기록을 초기화했어요'); navigate('#home'); } };
  $('#fakeAway').onclick = () => { const d = new Date(); d.setDate(d.getDate() - 5); S.lastVisit = today(d); save(); toast('새로고침하면 복습 3문제부터 시작해요'); };
}

/* ---------------- 9. 시트·용어 ---------------- */
function openSheet(html) { const sh = $('#sheet'); $('.sheet-panel', sh).innerHTML = html; sh.classList.remove('hidden'); const b = $('.sheet-panel .btn', sh); if (b) b.focus(); }
function closeSheet() { $('#sheet').classList.add('hidden'); }
function openTerm(t) {
  const d = TERMS[t]; if (!d) return;
  S.glossary[t] = (S.glossary[t] || 0) + 1; save();
  openSheet(`<div style="display:flex;gap:10px;align-items:flex-end">${daram('happy', 64)}<div class="speech"><h3>${t}</h3>${d.d}</div></div>
    <div class="sheet-ex"><b>생활 예시</b>${d.ex}</div><div class="sheet-meta">📒 내 용어장에 저장됨 · ${S.glossary[t]}번째 열람</div><button class="btn" data-close>알겠어!</button>`);
}
document.addEventListener('click', e => {
  const tb = e.target.closest('.term[data-term]'); if (tb) { e.preventDefault(); e.stopPropagation(); openTerm(tb.dataset.term); return; }
  if (e.target.closest('[data-close]')) { closeSheet(); return; }
  const sl = e.target.closest('[data-start]'); if (sl) { closeSheet(); navigate('#lesson/' + sl.dataset.start); return; }
  const ln = e.target.closest('[data-lesson]'); if (ln) { openLessonSheet(ln.dataset.lesson); return; }
  const lg = e.target.closest('[data-lesson-go]'); if (lg) { clearAction(); navigate('#lesson/' + lg.dataset.lessonGo); return; }
  const go = e.target.closest('[data-go]'); if (go && !go.disabled) { e.preventDefault(); clearAction(); navigate(go.dataset.go); }
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------------- 10. 내부 라우터 ----------------
   주소창의 #을 바꾸지 않아서, 미리보기 창(iframe)이나 파일로 열어도 다른 페이지로 튕기지 않음 */
let ROUTE = '#home';
function navigate(h) { ROUTE = h; route(); }
function route() {
  closeSheet(); hideFb(); clearAction();
  const [v, a] = (ROUTE.slice(1) || 'home').split('/');
  switch (v) {
    case 'lesson': openLesson(a); break;
    case 'done': viewDone(a); break;
    case 'placement': viewPlacement(); break;
    case 'review': viewReview(a); break;
    case 'sim': a ? viewSim(a) : viewSimList(); break;
    case 'glossary': viewGlossary(); break;
    case 'records': viewRecords(); break;
    default: viewHome();
  }
  const nk = ['sim', 'glossary', 'records'].includes(v) ? v : 'home';
  $$('.nav button').forEach(x => x.classList.toggle('on', x.dataset.nav === nk));
  if (v !== 'lesson' && v !== 'review') window.scrollTo(0, 0);
}
(function init() {
  const t = today(), prev = S.lastVisit;
  const away = S.intro && prev && daysBetween(prev, t) >= 3 && buildReview(1).length > 0;
  S.lastVisit = t; save();
  navigate(away ? '#review/back' : '#home');
})();
</script>
